    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }

        header {

        }

        header h1 {
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        /* Botones Mezclar y Slideshow */
        #btn-mezclar, #btn-slideshow {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            margin: 0 5px 30px 5px;
            transition: background 0.3s;
        }

        #btn-mezclar:hover, #btn-slideshow:hover {
            background-color: #555;
        }

        /* DISEÑO DE COLUMNAS ESTILO PICTIME */
        .gallery-pictime {
            column-count: 3;
            column-gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .item {
            break-inside: avoid;
            margin-bottom: 15px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .item img {
            width: 100%;
            display: block;
            transition: transform 0.4s ease;
        }

        .item:hover img {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .gallery-pictime {
                column-count: 2;
            }
        }

        @media (max-width: 480px) {
            .gallery-pictime {
                column-count: 1;
            }
        }

        /* EFECTOS KEN BURNS */
        @keyframes slowZoomIn {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); } 
        }
        @keyframes slowZoomOut {
            0% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes panLeft {
            0% { transform: scale(1.15) translateX(2%); }
            100% { transform: scale(1.15) translateX(-2%); } 
        }
        @keyframes panRight {
            0% { transform: scale(1.15) translateX(-2%); }
            100% { transform: scale(1.15) translateX(2%); }
        }

        .gslide:nth-child(4n+1) .gslide-image img { animation: slowZoomIn 15s ease-in-out infinite alternate; }
        .gslide:nth-child(4n+2) .gslide-image img { animation: panLeft 15s ease-in-out infinite alternate; }
        .gslide:nth-child(4n+3) .gslide-image img { animation: slowZoomOut 15s ease-in-out infinite alternate; }
        .gslide:nth-child(4n+4) .gslide-image img { animation: panRight 15s ease-in-out infinite alternate; }

        /* TRANSICIÓN SLIDESHOW */
        .gfadeIn, .gfadeOut, .gslideInPrev, .gslideInNext, .gslideOutPrev, .gslideOutNext {
            animation-duration: 1.5s !important;
        }
    </style>

    <!-- LIBRERÍA GLIGHTBOX Y SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        const lightbox = GLightbox({
            selector: '.glightbox',
            slideEffect: 'fade', 
            touchNavigation: true,
            loop: true
        });

        const btnSlideshow = document.getElementById('btn-slideshow');
        const musicaFondo = document.getElementById('musica-fondo');
        let intervaloSlideshow;
        let indexActual = 0; 

        lightbox.on('slide_changed', ({ current }) => {
            indexActual = current.index;
        });

        btnSlideshow.addEventListener('click', () => {
            musicaFondo.play();
            
            const elementos = lightbox.elements;
            let inicio = 0;
            
            // Si hay videos al principio, los saltamos
            while (elementos[inicio] && (elementos[inicio].href.includes('youtube') || elementos[inicio].href.includes('.mp4'))) {
                inicio++;
            }
            
            lightbox.openAt(inicio);

            intervaloSlideshow = setInterval(() => {
                let siguienteIndex = indexActual + 1;
                
                if (siguienteIndex >= elementos.length) siguienteIndex = 0;
                
                // Saltamos cualquier video durante el pase de diapositivas
                while (elementos[siguienteIndex].href.includes('youtube') || 
                       elementos[siguienteIndex].href.includes('.mp4') || 
                       elementos[siguienteIndex].href.includes('vimeo')) {
                    
                    siguienteIndex++; 
                    if (siguienteIndex >= elementos.length) siguienteIndex = 0;
                }
                
                lightbox.goToSlide(siguienteIndex);
            }, 6000); 
        });

        lightbox.on('close', () => {
            musicaFondo.pause();
            musicaFondo.currentTime = 0;
            clearInterval(intervaloSlideshow);
        });

        document.getElementById('btn-mezclar').addEventListener('click', function() {
            const galeria = document.getElementById('galeria');
            const items = Array.from(galeria.querySelectorAll('.item'));
            
            galeria.style.opacity = '0';
            
            setTimeout(() => {
                items.sort(() => Math.random() - 0.5);
                items.forEach(item => galeria.appendChild(item));
                galeria.style.opacity = '1';
                galeria.style.transition = 'opacity 0.4s ease';
            }, 200);
        });
        
    </script>

/* Contenedor de cada foto */
.item {
  margin-bottom: 15px; 
  break-inside: avoid; 
  overflow: hidden; /* ¡Clave! Evita que la foto se salga de su cuadro al hacer zoom */
  border-radius: 4px; /* Opcional: le da un ligero redondeo a las esquinas */
}

/* La imagen en estado normal */
.item img {
  width: 100%;
  display: block;
  transition: transform 0.4s ease; /* Hace que el acercamiento sea suave y fluido */
}

/* El efecto al pasar el mouse (Hover) */
.item:hover img {
  transform: scale(1.05); /* Acercamiento sutil del 5%. Si lo quieres más intenso puedes usar 1.1 */
}
        /* 1. Definimos los movimientos lentos (Efecto Ken Burns) */
@keyframes slowZoomIn {
  0% { transform: scale(1); }
  100% { transform: scale(1.15); } /* Zoom discreto del 15% */
}
@keyframes slowZoomOut {
  0% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
@keyframes panLeft {
  0% { transform: scale(1.15) translateX(2%); }
  100% { transform: scale(1.15) translateX(-2%); } /* Paneo suave */
}
@keyframes panRight {
  0% { transform: scale(1.15) translateX(-2%); }
  100% { transform: scale(1.15) translateX(2%); }
}

/* 2. Aplicamos la animación SOLO a la foto abierta (.current) */
/* Usamos nth-child para alternar el efecto en cada foto automáticamente */

/* Foto 1, 5, 9... (Zoom In) */
.gslide:nth-child(4n+1).current .gslide-image img {
  animation: slowZoomIn 15s ease-in-out infinite alternate;
}
/* Foto 2, 6, 10... (Paneo Izquierda) */
.gslide:nth-child(4n+2).current .gslide-image img {
  animation: panLeft 15s ease-in-out infinite alternate;
}
/* Foto 3, 7, 11... (Zoom Out) */
.gslide:nth-child(4n+3).current .gslide-image img {
  animation: slowZoomOut 15s ease-in-out infinite alternate;
}
/* Foto 4, 8, 12... (Paneo Derecha) */
.gslide:nth-child(4n+4).current .gslide-image img {
  animation: panRight 15s ease-in-out infinite alternate;
}

    <!-- LIBRERÍA GLIGHTBOX Y SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        // Activar el zoom y la galería
        const lightbox = GLightbox({
            selector: '.glightbox',
            slideEffect: 'fade', // <-- Esto hace una transición suave cruzada
            touchNavigation: true,
            loop: true
        });

        // 1. Obtenemos el botón y la música
const btnSlideshow = document.getElementById('btn-slideshow');
const musicaFondo = document.getElementById('musica-fondo');
let intervaloSlideshow;

// 2. ¿Qué pasa al hacer clic en el botón?
btnSlideshow.addEventListener('click', () => {
  // Reproducir la canción
  musicaFondo.play();
  
  // Abrir la galería en la primera foto (índice 0)
  lightbox.openAt(0);

  // Cambiar a la siguiente foto cada 4 segundos (4000 milisegundos)
  intervaloSlideshow = setInterval(() => {
    lightbox.nextSlide();
  }, 4000); 
});

// 3. ¿Qué pasa cuando el cliente cierra la foto (la X)?
lightbox.on('close', () => {
  // Pausar la música y reiniciarla al principio
  musicaFondo.pause();
  musicaFondo.currentTime = 0;
  
  // Detener el avance automático
  clearInterval(intervaloSlideshow);
});        
        // Lógica del Botón Mezclar
        document.getElementById('btn-mezclar').addEventListener('click', function() {
            const galeria = document.getElementById('galeria');
            const items = Array.from(galeria.querySelectorAll('.item'));
            
            galeria.style.opacity = '0';
            
            setTimeout(() => {
                items.sort(() => Math.random() - 0.5);
                items.forEach(item => galeria.appendChild(item));
                galeria.style.opacity = '1';
                galeria.style.transition = 'opacity 0.4s ease';
            }, 200);
        });
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolios | Vértice Digital</title>
    <link rel="icon" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    
    <!-- Metas para la carpeta de Niños -->
<meta property="og:title" content="Portafolio de XV Años | Vértice Digital">
<meta property="og:description" content="Conoce nuestro trabajo en XV Años y descubre cómo capturamos los mejores recuerdos.">
<meta property="og:image" content="https://portafoliovertice.vercel.app/ninos/banner-3-anios.jpg">
<meta property="og:url" content="https://portafoliovertice.vercel.app/ninos/">
<meta property="og:type" content="website">
      
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 50px 20px;
            text-align: center;
            color: #333;
        }
        h1 {
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 40px;
        }
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .menu-btn {
            background-color: #333;
            color: white;
            text-decoration: none;
            padding: 25px;
            border-radius: 8px;
            font-size: 18px;
            transition: background 0.3s, transform 0.2s;
            display: block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .menu-btn:hover {
            background-color: #555;
            transform: translateY(-5px);
        }
      .btn-copiar {
    background: transparent;
    border: none;
    color: #666666; /* Un gris discreto */
    font-size: 0.9rem;
    margin-top: -10px; /* Lo acerca un poco al botón de arriba */
    margin-bottom: 25px; /* Da espacio antes de la siguiente categoría */
    cursor: pointer;
    text-decoration: underline;
}

.btn-copiar:active {
    color: #000000; /* Se oscurece al tocarlo */
}
    </style>
</head>
<body>
    <div style="text-align: center; margin-top: 20px; margin-bottom: 20px; cursor: pointer;" onclick="copiarLink()" title="Clic para copiar enlace">
    <img id="img-camara" alt="Ícono Vértice Digital" style="width: 80px; vertical-align: middle;">
    <img id="img-texto" alt="Texto Vértice Digital" style="width: 200px; vertical-align: middle; margin-left: 10px;">
</div>
        <p>Selecciona una categoría para ver nuestro portafolio</p>
    
    <div class="menu-container">
    <a href="bodas/" class="menu-btn">💍 Bodas</a>
    <button class="btn-copiar" onclick="copiarEnlaceFijo('/bodas/')">Copiar link 🔗</button>

    <a href="xv/" class="menu-btn">👑 XV Años</a>
    <button class="btn-copiar" onclick="copiarEnlaceFijo('/xv/')">Copiar link 🔗</button>

    <a href="ninos/" class="menu-btn">🧸 Eventos Infantiles</a>
    <button class="btn-copiar" onclick="copiarEnlaceFijo('/ninos/')">Copiar link 🔗</button>

    <a href="eventos/" class="menu-btn">🎉 Eventos en General</a>
    <button class="btn-copiar" onclick="copiarEnlaceFijo('/eventos/')">Copiar link 🔗</button>
</div>
<script src="logos.js"></script>
<script>
    // Carga de tus logos en base64
    document.getElementById('img-camara').src = logoCamara;
    document.getElementById('img-texto').src = logoTexto;

    // Función mágica para copiar el link
    function copiarLink() {
        const enlace = "https://portafoliovertice.vercel.app/";
        navigator.clipboard.writeText(enlace).then(() => {
            alert("¡Link copiado! Listo para pegarse en WhatsApp. 📷");
        }).catch(err => {
            console.error('Error al copiar: ', err);
        });
    }
</script>
    
  </body>
  </html>

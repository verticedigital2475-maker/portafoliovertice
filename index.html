    <!-- Librería GLightbox (Para el zoom) -->

    <!-- ESTILOS CSS -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        /* Botón para mezclar */
        #btn-mezclar {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 30px;
            transition: background 0.3s;
        }

        #btn-mezclar:hover {
            background-color: #555;
        }

        /* DISEÑO DE COLUMNAS ESTILO PICTIME */
        .gallery-pictime {
            column-count: 3;
            column-gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .item {
            break-inside: avoid;
            margin-bottom: 15px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .item img {
            width: 100%;
            display: block;
            transition: transform 0.4s ease;
        }

        .item:hover img {
            transform: scale(1.03);
        }

        /* Ajuste para celulares y tablets */
        @media (max-width: 768px) {
            .gallery-pictime {
                column-count: 2;
            }
        }

        @media (max-width: 480px) {
            .gallery-pictime {
                column-count: 1; /* Opciones: 1 o 2 columnas en móvil */
            }
        }
/* Contenedor de cada foto */
.item {
  margin-bottom: 15px;

}

/* La imagen en estado normal */
.item img {

}

/* El efecto al pasar el mouse (Hover) */

}

    <!-- LIBRERÍA GLIGHTBOX Y SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        // Activar el zoom y la galería
        const lightbox = GLightbox({
            selector: '.glightbox',
            touchNavigation: true,
            loop: true
        });

        // Lógica del Botón Mezclar
        document.getElementById('btn-mezclar').addEventListener('click', function() {
            const galeria = document.getElementById('galeria');
            const items = Array.from(galeria.querySelectorAll('.item'));
            
            galeria.style.opacity = '0';
            
            setTimeout(() => {
                items.sort(() => Math.random() - 0.5);
                items.forEach(item => galeria.appendChild(item));
                galeria.style.opacity = '1';
                galeria.style.transition = 'opacity 0.4s ease';
            }, 200);
        });
    </script>

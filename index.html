    <!-- ESTILOS CSS -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        /* Botones Mezclar y Slideshow */
        #btn-mezclar, #btn-slideshow {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            margin: 0 5px 30px 5px; /* Espacio entre los botones */
            transition: background 0.3s;
        }

        #btn-mezclar:hover, #btn-slideshow:hover {
            background-color: #555;
        }

        /* DISEÑO DE COLUMNAS ESTILO PICTIME */
        .gallery-pictime {
            column-count: 3;
            column-gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Contenedor de cada foto */
        .item {
            break-inside: avoid;
            margin-bottom: 15px;
            border-radius: 4px; /* Opcional: le da un ligero redondeo a las esquinas */
            overflow: hidden; /* ¡Clave! Evita que la foto se salga de su cuadro al hacer zoom */
            position: relative;
        }

        /* La imagen en estado normal */
        .item img {
            width: 100%;
            display: block;
            transition: transform 0.4s ease; /* Hace que el acercamiento sea suave y fluido */
        }

        /* El efecto al pasar el mouse (Hover) en el grid */
        .item:hover img {
            transform: scale(1.05); /* Acercamiento sutil del 5% */
        }

        /* Ajuste para celulares y tablets */
        @media (max-width: 768px) {
            .gallery-pictime {
                column-count: 2;
            }
        }

        @media (max-width: 480px) {
            .gallery-pictime {
                column-count: 1;
            }
        }

        /* ========================================================
           EFECTOS KEN BURNS (Movimientos lentos al abrir la foto)
           ======================================================== */
        @keyframes slowZoomIn {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); } 
        }
        @keyframes slowZoomOut {
            0% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes panLeft {
            0% { transform: scale(1.15) translateX(2%); }
            100% { transform: scale(1.15) translateX(-2%); } 
        }
        @keyframes panRight {
            0% { transform: scale(1.15) translateX(-2%); }
            100% { transform: scale(1.15) translateX(2%); }
        }

        /* Aplicamos la animación de forma continua para evitar saltos en la transición */
        .gslide:nth-child(4n+1) .gslide-image img { animation: slowZoomIn 15s ease-in-out infinite alternate; }
        .gslide:nth-child(4n+2) .gslide-image img { animation: panLeft 15s ease-in-out infinite alternate; }
        .gslide:nth-child(4n+3) .gslide-image img { animation: slowZoomOut 15s ease-in-out infinite alternate; }
        .gslide:nth-child(4n+4) .gslide-image img { animation: panRight 15s ease-in-out infinite alternate; }

        /* ========================================================
   TRANSICIÓN MÁS LENTA PARA EL SLIDESHOW (Fundido suave)
   ======================================================== */
.gfadeIn, .gfadeOut, .gslideInPrev, .gslideInNext, .gslideOutPrev, .gslideOutNext {
    animation-duration: 1.5s !important;
}

    <!-- LIBRERÍA GLIGHTBOX Y SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script>
        // Activar el zoom y la galería
        const lightbox = GLightbox({
            selector: '.glightbox',
            slideEffect: 'fade', // Hace una transición suave cruzada
            touchNavigation: true,
            loop: true
        });

        // ==========================================
        // LÓGICA DEL SLIDESHOW CON MÚSICA (ACTUALIZADA)
        // ==========================================
        const btnSlideshow = document.getElementById('btn-slideshow');
        const musicaFondo = document.getElementById('musica-fondo');
        let intervaloSlideshow;
        let indexActual = 0; 

        // 1. Rastrear en qué foto exacta estamos en todo momento
        lightbox.on('slide_changed', ({ current }) => {
            indexActual = current.index;
        });

        btnSlideshow.addEventListener('click', () => {
            musicaFondo.play();
            
            // Obtener todos los elementos de la galería tal como los lee GLightbox
            const elementos = lightbox.elements;
            let inicio = 0;
            
            // 2. Si el cliente le da click al Slideshow, pero el primer elemento 
            // de la galería es un video, nos lo saltamos para empezar en una foto.
            while (elementos[inicio] && (elementos[inicio].href.includes('youtube') || elementos[inicio].href.includes('.mp4'))) {
                inicio++;
            }
            
            lightbox.openAt(inicio);

            // 3. Cambiar foto cada 6 segundos
            intervaloSlideshow = setInterval(() => {
                let siguienteIndex = indexActual + 1;
                
                // Si llegamos al final de la galería, reiniciamos desde el principio
                if (siguienteIndex >= elementos.length) siguienteIndex = 0;
                
                // MAGIA: Si el elemento que sigue es un video, nos lo saltamos
                while (elementos[siguienteIndex].href.includes('youtube') || 
                       elementos[siguienteIndex].href.includes('.mp4') || 
                       elementos[siguienteIndex].href.includes('vimeo')) {
                    
                    siguienteIndex++; // Brincamos al siguiente
                    if (siguienteIndex >= elementos.length) siguienteIndex = 0;
                }
                
                // Avanzamos a la foto segura
                lightbox.goToSlide(siguienteIndex);
            }, 6000); 
        });

        // 4. Detener todo al cerrar
        lightbox.on('close', () => {
            musicaFondo.pause();
            musicaFondo.currentTime = 0;
            clearInterval(intervaloSlideshow);
        });
        // ==========================================
        // LÓGICA DEL BOTÓN MEZCLAR
        // ==========================================
        document.getElementById('btn-mezclar').addEventListener('click', function() {
            const galeria = document.getElementById('galeria');
            const items = Array.from(galeria.querySelectorAll('.item'));
            
            galeria.style.opacity = '0';
            
            setTimeout(() => {
                items.sort(() => Math.random() - 0.5);
                items.forEach(item => galeria.appendChild(item));
                galeria.style.opacity = '1';
                galeria.style.transition = 'opacity 0.4s ease';
            }, 200);
        });
        
    </script>
